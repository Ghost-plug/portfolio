<!DOCTYPE html>
<html lang="en">

<head>
  <!-- ============================================================
       SEO & META
       ============================================================ -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Thank you for reaching out to Daniel Essien." />
  <meta name="robots" content="noindex, nofollow" />
  <title>Message Received — Daniel Essien</title>

  <!-- ============================================================
       GOOGLE FONTS — mirrors main portfolio
       Playfair Display + DM Sans
       ============================================================ -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap"
    rel="stylesheet" />

  <style>
    /* ============================================================
       CSS CUSTOM PROPERTIES — exact mirror of portfolio palette
       ============================================================ */
    :root {
      --bg:             #0F0F0E;
      --bg-card:        #1A1A18;
      --border:         rgba(255, 255, 255, 0.07);
      --accent:         #C8A96E;
      --accent-muted:   #a8884e;
      --accent-faint:   rgba(200, 169, 110, 0.10);
      --accent-glow:    rgba(200, 169, 110, 0.18);
      --text-primary:   #F0EDE8;
      --text-secondary: #9A9589;
      --text-muted:     #5A5650;
      --font-display:   'Playfair Display', Georgia, serif;
      --font-body:      'DM Sans', system-ui, sans-serif;
      --ease-expo:      cubic-bezier(0.16, 1, 0.3, 1);
      --ease-smooth:    cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }

    /* ============================================================
       RESET & BASE
       ============================================================ */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
    }

    body {
      font-family: var(--font-body);
      background: var(--bg);
      color: var(--text-primary);
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
      position: relative;
    }

    a { color: inherit; text-decoration: none; }

    /* ============================================================
       CANVAS — gold dust particles (JS-driven, fades in late)
       ============================================================ */
    #particle-canvas {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      opacity: 0;
      animation: fade-in-slow 1.4s var(--ease-smooth) 2.6s forwards;
    }

    /* ============================================================
       AMBIENT GLOW BLOBS — CSS-only atmospheric depth
       ============================================================ */
    .glow {
      position: fixed;
      border-radius: 50%;
      filter: blur(110px);
      pointer-events: none;
      z-index: 0;
    }

    .glow-top {
      width: 520px; height: 520px;
      background: radial-gradient(circle, rgba(200,169,110,0.07) 0%, transparent 70%);
      top: -140px; right: -100px;
      animation: glow-drift-a 9s ease-in-out infinite alternate;
    }

    .glow-bottom {
      width: 380px; height: 380px;
      background: radial-gradient(circle, rgba(200,169,110,0.05) 0%, transparent 70%);
      bottom: -100px; left: -100px;
      animation: glow-drift-b 11s ease-in-out infinite alternate;
    }

    @keyframes glow-drift-a {
      from { transform: translate(0,  0  ) scale(1);    }
      to   { transform: translate(-28px, 28px) scale(1.07); }
    }
    @keyframes glow-drift-b {
      from { transform: translate(0, 0) scale(1);     }
      to   { transform: translate(18px, -22px) scale(1.05); }
    }

    /* ============================================================
       KEYFRAMES — shared fades & rises
       ============================================================ */
    @keyframes fade-in-slow {
      to { opacity: 1; }
    }

    @keyframes rise-in {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ============================================================
       MAIN CARD
       ============================================================ */
    .card {
      position: relative;
      z-index: 1;
      width: min(560px, calc(100vw - 48px));
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 3px;
      padding: 64px 56px 52px;
      text-align: center;

      /* Card blooms into place */
      opacity: 0;
      transform: translateY(30px) scale(0.97);
      animation: card-bloom 1s var(--ease-expo) 0.15s forwards;
    }

    @keyframes card-bloom {
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* Decorative corner brackets — same motif as portfolio hero photo */
    .card::before,
    .card::after {
      content: '';
      position: absolute;
      width: 32px; height: 32px;
    }
    .card::before {
      top: -1px; left: -1px;
      border-top: 2px solid var(--accent);
      border-left: 2px solid var(--accent);
    }
    .card::after {
      bottom: -1px; right: -1px;
      border-bottom: 2px solid var(--accent);
      border-right: 2px solid var(--accent);
    }

    /* Offset shadow block behind card */
    .card-shadow {
      position: absolute;
      inset: 13px -13px -13px 13px;
      border: 1px solid rgba(255,255,255,0.04);
      border-radius: 3px;
      z-index: -1;
      pointer-events: none;
      opacity: 0;
      animation: card-bloom 1s var(--ease-expo) 0.25s forwards;
    }

    /* ============================================================
       ICON — SVG self-drawing checkmark
       ============================================================ */
    .icon-wrap {
      width: 88px; height: 88px;
      margin: 0 auto 36px;
      position: relative;

      opacity: 0;
      transform: scale(0.55);
      animation: icon-pop 0.75s var(--ease-expo) 0.75s forwards;
    }

    @keyframes icon-pop {
      to { opacity: 1; transform: scale(1); }
    }

    /* Pulsing outer ring — starts after icon appears */
    .icon-ring {
      position: absolute;
      inset: -14px;
      border-radius: 50%;
      border: 1px solid var(--accent-glow);
      opacity: 0;
      animation: ring-appear 0.4s ease 2.1s forwards,
                 ring-pulse  3s ease-in-out 2.5s infinite;
    }

    @keyframes ring-appear {
      to { opacity: 1; }
    }

    @keyframes ring-pulse {
      0%, 100% { transform: scale(1);    opacity: 0.55; }
      50%       { transform: scale(1.13); opacity: 0;    }
    }

    /* SVG dimensions */
    .icon-svg {
      width: 88px; height: 88px;
      display: block;
      overflow: visible;
    }

    /* Background fill bloom — appears just before tick completes */
    .check-fill {
      fill: var(--accent-faint);
      transform-origin: 44px 44px;
      transform: scale(0);
      animation: fill-bloom 0.55s var(--ease-expo) 1.85s forwards;
    }

    @keyframes fill-bloom {
      to { transform: scale(1); }
    }

    /* Outer circle draws itself stroke-by-stroke */
    .check-circle {
      fill: none;
      stroke: var(--accent);
      stroke-width: 1.5;
      stroke-linecap: round;
      /* circumference of r=40 circle = 2π×40 ≈ 251.3 */
      stroke-dasharray: 251.3;
      stroke-dashoffset: 251.3;
      /* rotate so drawing starts at top */
      transform-origin: 44px 44px;
      transform: rotate(-90deg);
      animation: draw-circle 0.95s var(--ease-expo) 0.95s forwards;
    }

    @keyframes draw-circle {
      to { stroke-dashoffset: 0; }
    }

    /* Tick draws after circle finishes */
    .check-tick {
      fill: none;
      stroke: var(--accent);
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      /* path length ~40 for points 28,45 38,55 60,33 */
      stroke-dasharray: 42;
      stroke-dashoffset: 42;
      animation: draw-tick 0.45s var(--ease-expo) 1.85s forwards;
    }

    @keyframes draw-tick {
      to { stroke-dashoffset: 0; }
    }

    /* ============================================================
       TYPOGRAPHY — staggered reveals
       ============================================================ */
    .eyebrow {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-size: 0.68rem;
      font-weight: 500;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 14px;

      opacity: 0;
      transform: translateY(12px);
      animation: rise-in 0.65s var(--ease-expo) 2.15s forwards;
    }

    .eyebrow::before,
    .eyebrow::after {
      content: '';
      display: block;
      width: 20px; height: 1px;
      background: var(--accent);
      flex-shrink: 0;
    }

    .heading {
      font-family: var(--font-display);
      font-size: clamp(1.9rem, 5vw, 2.75rem);
      font-weight: 700;
      line-height: 1.15;
      letter-spacing: -0.02em;
      color: var(--text-primary);
      margin-bottom: 18px;

      opacity: 0;
      transform: translateY(14px);
      animation: rise-in 0.65s var(--ease-expo) 2.3s forwards;
    }

    .heading em {
      font-style: italic;
      color: var(--accent);
    }

    .body-text {
      font-size: 0.97rem;
      color: var(--text-secondary);
      font-weight: 300;
      line-height: 1.82;
      max-width: 370px;
      margin: 0 auto 36px;

      opacity: 0;
      transform: translateY(12px);
      animation: rise-in 0.65s var(--ease-expo) 2.45s forwards;
    }

    /* ============================================================
       DIVIDER
       ============================================================ */
    .divider {
      width: 0;
      height: 1px;
      background: var(--border);
      margin: 0 auto 32px;
      animation: grow-line 0.7s var(--ease-expo) 2.6s forwards;
    }

    @keyframes grow-line {
      to { width: 100%; }
    }

    /* ============================================================
       RESPONSE TIME CHIP
       ============================================================ */
    .time-chip {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      padding: 11px 18px;
      border: 1px solid var(--border);
      border-radius: 2px;
      margin-bottom: 36px;

      opacity: 0;
      transform: translateY(10px);
      animation: rise-in 0.65s var(--ease-expo) 2.72s forwards;
    }

    .time-chip:hover {
      border-color: rgba(200,169,110,0.2);
    }

    .time-icon {
      font-size: 0.85rem;
      line-height: 1;
    }

    .time-text {
      font-size: 0.76rem;
      color: var(--text-muted);
      font-weight: 400;
      letter-spacing: 0.02em;
    }

    .time-text strong {
      color: var(--accent);
      font-weight: 500;
    }

    /* ============================================================
       ACTION BUTTONS
       ============================================================ */
    .actions {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      flex-wrap: wrap;

      opacity: 0;
      transform: translateY(10px);
      animation: rise-in 0.65s var(--ease-expo) 2.85s forwards;
    }

    /* Primary — back to portfolio */
    .btn-primary {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      padding: 13px 28px;
      background: var(--accent);
      color: #0F0F0E;
      font-family: var(--font-body);
      font-size: 0.8rem;
      font-weight: 500;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      border-radius: 2px;
      border: none;
      cursor: pointer;
      transition:
        background 0.3s var(--ease-smooth),
        transform  0.3s var(--ease-smooth),
        box-shadow 0.3s var(--ease-smooth);
    }

    .btn-primary:hover {
      background: var(--accent-muted);
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(200,169,110,0.28);
    }

    .btn-primary svg {
      width: 13px; height: 13px;
      transition: transform 0.3s var(--ease-smooth);
    }

    .btn-primary:hover svg {
      transform: translateX(-3px);
    }

    /* Ghost — view projects */
    .btn-ghost {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 24px;
      background: transparent;
      color: var(--text-secondary);
      font-family: var(--font-body);
      font-size: 0.8rem;
      font-weight: 400;
      letter-spacing: 0.04em;
      border-radius: 2px;
      border: 1px solid var(--border);
      cursor: pointer;
      transition:
        color        0.3s var(--ease-smooth),
        border-color 0.3s var(--ease-smooth),
        background   0.3s var(--ease-smooth),
        transform    0.3s var(--ease-smooth);
    }

    .btn-ghost:hover {
      color: var(--text-primary);
      border-color: var(--accent);
      background: var(--accent-faint);
      transform: translateY(-2px);
    }

    /* ============================================================
       FIXED FOOTER WORDMARK
       ============================================================ */
    .page-footer {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1;

      opacity: 0;
      animation: rise-in 0.65s var(--ease-expo) 3.05s forwards;
    }

    .wordmark {
      font-family: var(--font-display);
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--text-muted);
      letter-spacing: 0.03em;
      white-space: nowrap;
    }

    .wordmark span { color: var(--accent); }

    /* ============================================================
       RESPONSIVE
       ============================================================ */
    @media (max-width: 540px) {
      .card { padding: 48px 28px 40px; }

      .actions {
        flex-direction: column;
        width: 100%;
      }

      .btn-primary,
      .btn-ghost {
        width: 100%;
        justify-content: center;
      }
    }
  </style>
</head>

<body>

  <!-- Atmospheric glow blobs -->
  <div class="glow glow-top"    aria-hidden="true"></div>
  <div class="glow glow-bottom" aria-hidden="true"></div>

  <!-- Gold dust particle canvas (activated after sequence completes) -->
  <canvas id="particle-canvas" aria-hidden="true"></canvas>

  <!-- ============================================================
       MAIN CARD
       ============================================================ -->
  <main>
    <div class="card" role="main" aria-label="Thank you confirmation">
      <div class="card-shadow" aria-hidden="true"></div>

      <!-- ==========================================
           SVG CHECKMARK — self-drawing animation
           Circle draws itself, then tick snaps in,
           then background fill blooms.
           ========================================== -->
      <div class="icon-wrap" aria-label="Success icon" role="img">
        <div class="icon-ring" aria-hidden="true"></div>
        <svg
          class="icon-svg"
          viewBox="0 0 88 88"
          xmlns="http://www.w3.org/2000/svg"
          aria-hidden="true"
        >
          <!-- Background fill — blooms after tick draws -->
          <circle class="check-fill" cx="44" cy="44" r="38" />

          <!-- Circle — draws itself via stroke-dashoffset -->
          <circle
            class="check-circle"
            cx="44" cy="44" r="40"
          />

          <!-- Tick — draws after circle finishes -->
          <polyline
            class="check-tick"
            points="27,45 38,56 61,32"
          />
        </svg>
      </div>

      <!-- Eyebrow -->
      <p class="eyebrow" aria-label="Status">Message Received</p>

      <!-- Heading -->
      <h1 class="heading">
        Thank you —<br>
        <em>I'll be in touch.</em>
      </h1>

      <!-- Body -->
      <p class="body-text">
        Your message landed safely. I read every note personally
        and make it a point to respond thoughtfully.
      </p>

      <!-- Divider line -->
      <div class="divider" aria-hidden="true"></div>

      <!-- Response time indicator -->
      <div class="time-chip" role="note" aria-label="Expected response time">
        <span class="time-icon" aria-hidden="true">⏳</span>
        <p class="time-text">
          Typical response within <strong>24 hours</strong>
        </p>
      </div>

      <!-- Action buttons -->
      <div class="actions">
        <!--
          UPDATE: If thank-you.html is hosted at a different URL
          than index.html, update the href values below accordingly.
        -->
        <a href="index.html" class="btn-primary" aria-label="Return to portfolio">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M13 8H3M7 4L3 8l4 4"/>
          </svg>
          Back to Portfolio
        </a>

        <a href="index.html#projects" class="btn-ghost" aria-label="Browse projects">
          View Projects
        </a>
      </div>

    </div>
  </main>

  <!-- Fixed footer wordmark -->
  <footer class="page-footer" role="contentinfo">
    <p class="wordmark" aria-label="Daniel Essien">D<span>.</span>Essien</p>
  </footer>

  <!-- ============================================================
       JAVASCRIPT — Gold dust particle system
       Tiny, slow-rising motes that fade in and out.
       Canvas opacity-transitions in at t=2.6s so it doesn't
       compete with the main animation sequence.
       ============================================================ -->
  <script>
    (function () {
      'use strict';

      const canvas = document.getElementById('particle-canvas');
      const ctx    = canvas.getContext('2d');

      // ============================================================
      // Resize canvas to fill viewport at all times
      // ============================================================
      function resize() {
        canvas.width  = window.innerWidth;
        canvas.height = window.innerHeight;
      }

      resize();
      window.addEventListener('resize', resize, { passive: true });

      // ============================================================
      // PARTICLE CLASS
      // Each mote is a tiny gold circle that drifts upward,
      // fading in gently and fading out before recycling.
      // ============================================================
      class Mote {
        constructor(initialPlacement) {
          this.init(initialPlacement);
        }

        init(anywhere) {
          // Position
          this.x = Math.random() * canvas.width;
          // On first run scatter across the full canvas;
          // thereafter always spawn at the bottom.
          this.y = anywhere
            ? Math.random() * canvas.height
            : canvas.height + 6;

          // Movement
          this.vy = Math.random() * 0.45 + 0.12; // upward drift speed
          this.vx = (Math.random() - 0.5) * 0.25; // gentle horizontal sway

          // Appearance
          this.radius     = Math.random() * 1.6 + 0.35;
          this.maxOpacity = Math.random() * 0.42 + 0.08;
          this.opacity    = 0;

          // Life cycle (in frames)
          this.maxAge    = Math.floor(Math.random() * 260 + 180);
          this.age       = 0;
          this.fadeInEnd  = Math.floor(this.maxAge * 0.25);
          this.fadeOutStart = Math.floor(this.maxAge * 0.72);
        }

        update() {
          this.age++;
          this.y -= this.vy;
          this.x += this.vx;

          // Fade in phase
          if (this.age <= this.fadeInEnd) {
            this.opacity = (this.age / this.fadeInEnd) * this.maxOpacity;
          }
          // Hold phase — opacity stays at maxOpacity
          // Fade out phase
          if (this.age >= this.fadeOutStart) {
            const fadeOutProgress =
              (this.age - this.fadeOutStart) / (this.maxAge - this.fadeOutStart);
            this.opacity = this.maxOpacity * (1 - fadeOutProgress);
          }

          // Recycle when fully transparent or off-screen
          if (this.age >= this.maxAge || this.y < -8) {
            this.init(false);
          }
        }

        draw() {
          if (this.opacity <= 0.005) return;
          ctx.save();
          ctx.globalAlpha = Math.max(0, Math.min(1, this.opacity));
          ctx.beginPath();
          ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
          ctx.fillStyle = '#C8A96E';
          ctx.fill();
          ctx.restore();
        }
      }

      // ============================================================
      // Create particle pool — 65 motes for subtle ambient field
      // ============================================================
      const POOL_SIZE = 65;
      const motes = Array.from(
        { length: POOL_SIZE },
        () => new Mote(true) // scatter on initial load
      );

      // ============================================================
      // Render loop
      // ============================================================
      function tick() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        for (let i = 0; i < motes.length; i++) {
          motes[i].update();
          motes[i].draw();
        }
        requestAnimationFrame(tick);
      }

      tick();
    })();
  </script>

</body>
</html>
